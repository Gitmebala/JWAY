<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141517">
<title>JWAY — JKUAT Campus Wayfinder</title>
<meta name="description" content="Walking directions across JKUAT Juja campus, down to the room. Spoken turn-by-turn, so you can keep your head up.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="app.css?v=163629">
</head>
<body>

<!-- opening plate: poured chrome, then it drains away -->
<div id="splash">
  <canvas id="splashMetal" aria-hidden="true"></canvas>
  <div class="splashInner">
    <div class="splashWord">JWAY</div>
    <div class="splashSub">JKUAT&nbsp;&middot;&nbsp;Juja campus</div>
  </div>
</div>

<div id="map" aria-label="JKUAT Juja campus map"></div>

<div class="card search" id="searchCard">
  <canvas id="metal" aria-hidden="true"></canvas>
  <div class="brand">
    <h1>JWAY</h1>
    <span class="tag">JKUAT <b>Juja</b></span>
    <button class="iconBtn" id="voiceBtn" title="Spoken directions" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z"/>
        <path class="wave1" d="M16.5 8.5a5 5 0 0 1 0 7"/>
        <path class="wave2" d="M19 6a8.5 8.5 0 0 1 0 12"/>
        <path class="slash" d="M3 3l18 18"/>
      </svg>
    </button>
    <button class="ghost" id="layerBtn">Satellite</button>
  </div>

  <div class="fields">
    <div class="field">
      <span class="dot a"></span>
      <input id="from" autocomplete="off" placeholder="Your starting point">
      <button class="mini" id="locBtn" title="Use my location" aria-label="Use my location">&#9678;</button>
      <div class="sugg" id="sFrom" hidden></div>
    </div>
    <div class="hairline"></div>
    <div class="field">
      <span class="dot b"></span>
      <input id="to" autocomplete="off" placeholder="Room, building or place">
      <button class="mini mic" id="micBtn" title="Say your destination" aria-label="Say your destination">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="2.5" width="6" height="11" rx="3"/>
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/>
        </svg>
      </button>
      <button class="mini" id="swapBtn" title="Swap" aria-label="Swap start and destination">&#8645;</button>
      <div class="sugg" id="sTo" hidden></div>
    </div>
  </div>

  <!-- nearest-of-a-kind, for when you don't know the name -->
  <div class="chips" id="chips"></div>
</div>

<div class="sheet" id="sheet">
  <div class="grab"><span></span></div>
  <div class="sheetBody" id="sheetBody"></div>
  <div class="credit">
    Made by <b>Bala</b>
  </div>
</div>

<div class="navbar" id="navBar" hidden>
  <div class="navTop">
    <div class="navIco"><svg viewBox="0 0 24 24" id="navIcoSvg"></svg></div>
    <div class="navTxt">
      <div class="navDist" id="navDist">—</div>
      <div class="navInstr" id="navInstr">Starting…</div>
      <div class="navSub" id="navSub"></div>
    </div>
    <button class="navExit" id="navExit" title="Stop" aria-label="Stop navigating">&times;</button>
  </div>
  <div class="navThen" id="navThen" hidden></div>
  <div class="navProg"><i id="navProgBar"></i></div>
  <div class="navFoot">
    <span id="navRemain">—</span><span class="navSep"></span><span id="navEta">—</span>
    <span class="navSep"></span><span id="navAwake" class="awake" hidden>screen held</span>
    <button class="recenter" id="recenter">Re-center</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<dialog id="dlg">
  <form method="dialog">
    <div class="dh">
      <h3 id="dlgTitle">Add or correct a room</h3>
      <p>JKUAT publishes room codes on its timetables but never says which building they're in.
         Anything you set here overrides what JWAY knows, on this device.</p>
    </div>
    <div class="db">
      <label><span class="lt">Room code</span><input id="fCode" placeholder="CTC 207" required></label>
      <label><span class="lt">Building</span><select id="fBld"></select></label>
      <div class="two">
        <label><span class="lt">Floor</span><select id="fFloor">
          <option value="0">Ground floor</option><option value="1">1st floor</option>
          <option value="2">2nd floor</option><option value="3">3rd floor</option>
          <option value="4">4th floor</option><option value="5">5th floor</option>
        </select></label>
        <label><span class="lt">Which side</span><select id="fWing">
          <option value="">— pick one —</option>
          <option>straight ahead as you enter</option>
          <option>far left of the corridor</option>
          <option>left wing</option>
          <option>middle of the corridor</option>
          <option>right wing</option>
          <option>far right of the corridor</option>
          <option>at the back of the building</option>
        </select></label>
      </div>
      <label><span class="lt">Anything that helps you spot it</span>
        <textarea id="fHint" placeholder="Staircase nearest the car park — the door right after the water dispenser."></textarea></label>
    </div>
    <div class="df"><button value="cancel">Cancel</button><button value="save" class="pri">Save</button></div>
  </form>
</dialog>


<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="data/campus.js?v=163629"></script>
<script src="app.js?v=163629"></script>
</body>
</html>
